<body class="bg-level-0 text-on-surface min-h-screen flex items-center justify-center font-body-md antialiased overflow-hidden relative">
<!-- Atmospheric Background Gradient -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-primary-container opacity-10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-surface-variant opacity-20 blur-[150px] rounded-full"></div>
</div>
<!-- Main Login Card Container -->
<main class="relative z-10 w-full max-w-[440px] px-margin_container">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-stack_lg">
<h1 class="text-headline-md font-headline-md font-black tracking-tight text-primary">CARBON.OS</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant mt-unit">Secure Authentication Gateway</p>
</div>
<!-- Card Surface -->
<div class="bg-level-1 border border-outline-blueprint rounded-xl p-stack_lg relative overflow-hidden">
<!-- Subtle top border highlight -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-primary/20"></div>
<form class="flex flex-col gap-stack_md">
<!-- Email Input -->
<div class="flex flex-col gap-unit">
<label class="text-label-md font-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative focus-glow border border-outline-blueprint rounded bg-level-0 transition-all duration-200">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">mail</span>
</span>
<input class="w-full bg-transparent border-none text-body-md font-body-md text-on-surface pl-10 py-2 focus:ring-0 placeholder:text-outline" id="email" placeholder="analyst@corp.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-unit">
<div class="flex justify-between items-center">
<label class="text-label-md font-label-md text-on-surface-variant" for="password">Password</label>
<a class="text-label-sm font-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Reset</a>
</div>
<div class="relative focus-glow border border-outline-blueprint rounded bg-level-0 transition-all duration-200">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">lock</span>
</span>
<input class="w-full bg-transparent border-none text-body-md font-body-md text-on-surface pl-10 py-2 focus:ring-0 placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="h-[1px] w-full bg-outline-blueprint my-stack_sm"></div>
<!-- Tenant Selector -->
<div class="flex flex-col gap-unit">
<label class="text-label-md font-label-md text-on-surface-variant" for="tenant">Tenant Workspace</label>
<div class="relative focus-glow border border-outline-blueprint rounded bg-level-0 transition-all duration-200">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-primary">
<span class="material-symbols-outlined text-[18px]">domain</span>
</span>
<select class="w-full bg-transparent border-none text-body-md font-body-md text-on-surface pl-10 pr-10 py-2 focus:ring-0 appearance-none cursor-pointer" id="tenant">
<option class="bg-level-1 text-on-surface">Global Logistics Corp</option>
<option class="bg-level-1 text-on-surface">Tesla India Mfg</option>
<option class="bg-level-1 text-on-surface">EcoRetail Europe</option>
</select>
<span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">unfold_more</span>
</span>
</div>
</div>
<!-- Role Preview (Visual Only for demonstration) -->
<div class="flex flex-col gap-unit">
<label class="text-label-md font-label-md text-on-surface-variant">Requested Role Session</label>
<div class="grid grid-cols-3 gap-unit">
<!-- Analyst (Selected) -->
<div class="border border-primary bg-primary/10 rounded flex flex-col items-center justify-center p-2 cursor-pointer transition-colors relative overflow-hidden">
<div class="absolute inset-0 bg-primary/5"></div>
<span class="material-symbols-outlined text-primary text-[20px] mb-1 z-10">analytics</span>
<span class="text-label-sm font-label-sm text-primary z-10">Analyst</span>
</div>
<!-- Admin -->

<span class="material-symbols-outlined text-[20px] mb-1">admin_panel_settings</span>
<span class="text-label-sm font-label-sm">Admin</span>
</div>

<span class="material-symbols-outlined text-[20px] mb-1">visibility</span>
<span class="text-label-sm font-label-sm text-center">Read-Only</span>
</div>
</div>
</div>

<button class="w-full mt-stack_sm bg-primary text-on-primary font-headline-sm text-headline-sm py-3 rounded hover:bg-primary-fixed transition-colors flex items-center justify-center gap-2" type="submit">
                    Initialize Session
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>

<a class="hover:text-primary transition-colors" href="#">System Status</a>
<span>•</span>
<a class="hover:text-primary transition-colors" href="#">Support</a>
</div>
</main>
<script>
        // Simple script to handle role selection visual toggle
        document.addEventListener('DOMContentLoaded', () => {
            const roleCards = document.querySelectorAll('.grid-cols-3 > div');
            roleCards.forEach(card => {
                card.addEventListener('click', () => {
                    // Reset all
                    roleCards.forEach(c => {
                        c.className = "border border-outline-blueprint bg-level-0 rounded flex flex-col items-center justify-center p-2 cursor-pointer hover:border-outline transition-colors text-on-surface-variant hover:text-on-surface";
                        const icon = c.querySelector('.material-symbols-outlined');
                        const text = c.querySelector('.text-label-sm');
                        if(icon) icon.className = "material-symbols-outlined text-[20px] mb-1";
                        if(text) text.className = "text-label-sm font-label-sm text-center";
                        
                        // remove inner bg if exists
                        const innerBg = c.querySelector('.absolute');
                        if(innerBg) innerBg.remove();
                    });

                    // Set active
                    card.className = "border border-primary bg-primary/10 rounded flex flex-col items-center justify-center p-2 cursor-pointer transition-colors relative overflow-hidden";
                    
                    const innerBg = document.createElement('div');
                    innerBg.className = "absolute inset-0 bg-primary/5";
                    card.prepend(innerBg);

                    const icon = card.querySelector('.material-symbols-outlined');
                    const text = card.querySelector('.text-label-sm');
                    if(icon) icon.className = "material-symbols-outlined text-primary text-[20px] mb-1 z-10";
                    if(text) text.className = "text-label-sm font-label-sm text-primary z-10 text-center";
                });
            });
        });
    </script>
