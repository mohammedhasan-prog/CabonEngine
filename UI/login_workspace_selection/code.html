<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - CarbonEngine</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Setup -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed": "#d8e3fb",
                      "surface-dim": "#0b1326",
                      "outline": "#879391",
                      "surface-bright": "#31394e",
                      "surface": "#0b1326",
                      "inverse-primary": "#006a61",
                      "on-tertiary-container": "#4f1700",
                      "outline-variant": "#3d4947",
                      "surface-container-high": "#222a3e",
                      "secondary": "#bcc7de",
                      "primary-container": "#29a195",
                      "primary-fixed-dim": "#6bd8cb",
                      "on-secondary-fixed": "#111c2d",
                      "surface-container-low": "#131b2e",
                      "primary-fixed": "#89f5e7",
                      "secondary-fixed-dim": "#bcc7de",
                      "surface-container-highest": "#2d3449",
                      "on-surface-variant": "#bcc9c6",
                      "on-surface": "#dbe2fd",
                      "surface-variant": "#2d3449",
                      "error-container": "#93000a",
                      "on-tertiary-fixed-variant": "#773215",
                      "on-tertiary-fixed": "#370e00",
                      "tertiary": "#ffb59a",
                      "secondary-container": "#3e495d",
                      "tertiary-fixed-dim": "#ffb59a",
                      "tertiary-container": "#d27956",
                      "inverse-on-surface": "#283044",
                      "background": "#0b1326",
                      "primary": "#6bd8cb",
                      "on-error-container": "#ffdad6",
                      "surface-tint": "#6bd8cb",
                      "on-background": "#dbe2fd",
                      "surface-container-lowest": "#060d20",
                      "on-primary-fixed-variant": "#005049",
                      "on-tertiary": "#591c02",
                      "on-secondary-fixed-variant": "#3c475a",
                      "on-primary-container": "#00302b",
                      "on-secondary-container": "#aeb9d0",
                      "on-secondary": "#263143",
                      "on-error": "#690005",
                      "inverse-surface": "#dbe2fd",
                      "surface-container": "#171f33",
                      "on-primary-fixed": "#00201d",
                      "error": "#ffb4ab",
                      "on-primary": "#003732",
                      "tertiary-fixed": "#ffdbce"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "unit": "4px",
                      "gutter": "16px",
                      "container-max": "100%",
                      "sidebar-width": "260px",
                      "margin-desktop": "32px"
              },
              "fontFamily": {
                      "display-lg": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "mono-data": ["monospace"],
                      "title-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "label-md": ["Inter"]
              },
              "fontSize": {
                      "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                      "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                      "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                      "mono-data": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                      "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                      "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                      "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                      "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
              }
            }
          }
        }
    </script>
<style>
        /* Custom styles to handle specific pseudo-element glows and custom form inputs without arbitrary values where possible */
        body {
            background: radial-gradient(circle at 50% 0%, var(--tw-colors-surface-container-highest) 0%, var(--tw-colors-background) 70%);
        }
        
        .industrial-input:focus {
            box-shadow: 0 0 0 1px var(--tw-colors-primary);
        }
        
        .radio-chip-input:checked + div {
            border-color: var(--tw-colors-primary);
            color: var(--tw-colors-primary);
            background-color: color-mix(in srgb, var(--tw-colors-primary) 10%, transparent);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-gutter antialiased text-on-surface relative overflow-hidden">
<!-- Decorative background elements to enhance the high-tech charcoal gradient feel -->
<div class="absolute inset-0 pointer-events-none overflow-hidden opacity-30">
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-surface-container-high rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-surface-container rounded-full blur-[100px]"></div>
</div>
<!-- Login Card Container -->
<main class="relative z-10 w-full max-w-[480px] bg-surface-container-low border border-outline-variant rounded-lg flex flex-col shadow-2xl shadow-background/50 backdrop-blur-sm">
<!-- Header Section -->
<header class="p-8 border-b border-outline-variant flex flex-col items-center text-center">
<div class="w-12 h-12 rounded bg-surface-container border border-outline flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">dataset</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2 tracking-tight">CarbonEngine</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure Global Telemetry Access</p>
</header>
<!-- Form Section -->
<form class="p-8 flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2 uppercase tracking-wider" for="email">
<span class="material-symbols-outlined text-[16px]">mail</span>
                    Operator ID / Email
                </label>
<div class="relative">
<input class="w-full bg-surface-dim border border-outline-variant rounded font-body-md text-body-md text-on-surface px-4 py-3 outline-none transition-colors industrial-input placeholder:text-outline-variant" id="email" name="email" placeholder="operator@domain.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2 uppercase tracking-wider" for="password">
<span class="material-symbols-outlined text-[16px]">lock</span>
                        Passkey
                    </label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#">Recover</a>
</div>
<div class="relative">
<input class="w-full bg-surface-dim border border-outline-variant rounded font-body-md text-body-md text-on-surface px-4 py-3 outline-none transition-colors industrial-input placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Tenant Workspace Dropdown -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2 uppercase tracking-wider" for="tenant">
<span class="material-symbols-outlined text-[16px]">domain</span>
                    Target Tenant Workspace
                </label>
<div class="relative">
<select class="w-full appearance-none bg-surface-dim border border-outline-variant rounded font-body-md text-body-md text-on-surface px-4 py-3 pr-10 outline-none transition-colors industrial-input" id="tenant" name="tenant" required="">
<option disabled="" selected="" value="">Select active tenant...</option>
<option value="glc">Global Logistics Corp</option>
<option value="tim">Tesla India Mfg</option>
<option value="ere">EcoRetail Europe</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Role Selector -->
<div class="flex flex-col gap-3 mt-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Access Clearance Level</label>
<div class="flex gap-2">
<label class="cursor-pointer flex-1">
<input checked="" class="peer sr-only radio-chip-input" name="role" type="radio" value="analyst"/>
<div class="py-2 px-1 border border-outline-variant text-center rounded transition-all font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-highest">
                            Analyst
                        </div>
</label>
<label class="cursor-pointer flex-1">
<input class="peer sr-only radio-chip-input" name="role" type="radio" value="admin"/>
<div class="py-2 px-1 border border-outline-variant text-center rounded transition-all font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-highest">
                            Admin
                        </div>
</label>
<label class="cursor-pointer flex-1">
<input class="peer sr-only radio-chip-input" name="role" type="radio" value="viewer"/>
<div class="py-2 px-1 border border-outline-variant text-center rounded transition-all font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-highest flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[14px]">visibility</span>
                            Read-Only
                        </div>
</label>
</div>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full bg-primary text-on-primary font-title-lg text-title-lg py-3 rounded flex items-center justify-center gap-2 hover:bg-primary-fixed transition-colors focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:ring-offset-2 focus:ring-offset-background active:scale-[0.98]" type="submit">
                Initialize Session
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer / Legal -->
<footer class="p-4 border-t border-outline-variant text-center bg-surface-container-lowest rounded-b-lg">
<p class="font-label-md text-label-md text-outline">
<span class="material-symbols-outlined text-[12px] align-middle mr-1">encrypted</span>
                End-to-end encrypted telemetry connection
            </p>
</footer>
</main>
</body></html>
